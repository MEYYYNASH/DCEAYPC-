plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dceay.musicapp'
    compileSdk 36
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.dceay.musicapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    // Pure native Android framework implementation - 0 external dependencies!
}
